<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kokoro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Box -->
  <rect width="64" height="64" rx="16" fill="#0f111a"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Audio Waveform Bars with Gradient & Glow -->
  <g filter="url(#glow)">
    <rect x="11" y="26" width="6" height="12" rx="3" fill="#6366f1"/>
    <rect x="21" y="15" width="6" height="34" rx="3" fill="#8b5cf6"/>
    <rect x="31" y="8"  width="6" height="48" rx="3" fill="#ec4899"/>
    <rect x="41" y="17" width="6" height="30" rx="3" fill="#f43f5e"/>
    <rect x="51" y="24" width="6" height="16" rx="3" fill="#fb923c"/>
  </g>
</svg>
